services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    ports:
      - "8096:8096/tcp"
      - "7359:7359/udp"
    volumes:
      - ./volumes/jellyfin-config:/config
      - ./volumes/jellyfin-cache:/cache
      - ./volumes/downloads:/media
    restart: 'unless-stopped'
    environment:
      - JELLYFIN_PublishedServerUrl=http://localhost

  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: deluge
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./volumes/deluge-config:/config
      - ./volumes/downloads:/downloads
      - ./volumes/torrent-files:/torrent-files
    ports:
      - "8112:8112"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - AUTO_UPDATE=true
    volumes:
      - ./volumes/jackett-config:/config
      - ./volumes/torrent-files:/torrent-files
    ports:
      - "9117:9117"
    restart: unless-stopped

volumes:
  jellyfin-config:
  jellyfin-cache:
  deluge-config:
  jackett-config:
  # Shared
  downloads:
  torrent-files:
